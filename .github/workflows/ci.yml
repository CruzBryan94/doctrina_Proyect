name: ARTEMIS CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [dev, production, devDoctrina]

permissions:
  contents: read

# Do not cancel production validations: Railway evaluates workflow conclusions.
concurrency:
  group: artemis-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application:
    name: PHP, Vite and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DATABASE_URL: ''
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, xml, curl, fileinfo, gd, zip, opcache
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies without application scripts
        run: composer install --no-scripts --prefer-dist --no-interaction --optimize-autoloader
      - name: Verify platform requirements
        run: composer check-platform-reqs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Vite assets
        run: npm run build
      - name: Validate Laravel startup caches in isolation
        run: php scripts/ci/validate-laravel.php
      - name: Run full suite in isolated SQLite
        run: php vendor/bin/phpunit --configuration phpunit.ci.xml

  container:
    name: Docker build and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runtime image without publishing
        run: docker build --tag artemis-ci:local .
      - name: Validate shell, PHP-FPM and Caddy
        run: |
          docker run --rm --entrypoint bash artemis-ci:local -n /usr/local/bin/artemis-start
          docker run --rm --entrypoint php-fpm artemis-ci:local -tt
          docker run --rm --entrypoint caddy artemis-ci:local validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Reject development files in runtime image
        run: |
          docker run --rm --entrypoint sh artemis-ci:local -ec '
            test ! -e /app/.env
            test ! -d /app/node_modules
            test ! -d /app/tests
            test ! -e /app/public/hot
            test -f /app/public/build/manifest.json
            test ! -d /app/vendor/phpunit
          '
      - name: Reject accidental Railway deployment from dev
        run: |
          set +e
          output=$(docker run --rm --env RAILWAY_PROJECT_ID=ci \
            --env RAILWAY_GIT_BRANCH=dev artemis-ci:local 2>&1)
          result=$?
          set -e
          test "$result" = 1
          printf '%s\n' "$output" | grep -F 'Railway startup requires the production GitHub branch'
      - name: Start web with disposable storage and no database service
        run: |
          docker volume create artemis-ci-storage
          docker run --detach --name artemis-ci-web --publish 127.0.0.1:8080:8080 \
            --mount type=volume,source=artemis-ci-storage,target=/app/storage \
            --env APP_KEY=base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ= \
            --env APP_URL=https://localhost --env SESSION_SECURE_COOKIE=true \
            --env DB_HOST=127.0.0.1 --env DB_PORT=1 --env DB_DATABASE=ci_unused \
            --env DB_USERNAME=ci_unused --env DB_PASSWORD=ci_unused artemis-ci:local
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs artemis-ci-web
          exit 1
      - name: Check hidden paths and persistent storage across restart
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/.env)" = 404
          docker exec --user www-data artemis-ci-web touch /app/storage/app/ci-persistence
          docker restart --time 20 artemis-ci-web
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/login > /dev/null; then
              docker exec artemis-ci-web test -f /app/storage/app/ci-persistence
              exit 0
            fi
            sleep 1
          done
          docker logs artemis-ci-web
          exit 1
      - name: Container diagnostics on failure
        if: ${{ failure() }}
        run: docker logs artemis-ci-web

  required:
    name: ARTEMIS CI required
    if: ${{ always() }}
    needs: [application, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both validations to succeed
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$CONTAINER_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SOURCE_BRANCH" = dev
            test "$SOURCE_REPOSITORY" = "$TARGET_REPOSITORY"
          fi
